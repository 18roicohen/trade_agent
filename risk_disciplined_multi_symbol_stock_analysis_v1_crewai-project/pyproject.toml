[project]
name = "risk_disciplined_multi_symbol_stock_analysis"
version = "0.1.0"
description = "risk_disciplined_multi_symbol_stock_analysis using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=0.177.0,<1.0.0"
]

[project.scripts]
risk_disciplined_multi_symbol_stock_analysis = "risk_disciplined_multi_symbol_stock_analysis.main:run"
run_crew = "risk_disciplined_multi_symbol_stock_analysis.main:run"
train = "risk_disciplined_multi_symbol_stock_analysis.main:train"
replay = "risk_disciplined_multi_symbol_stock_analysis.main:replay"
test = "risk_disciplined_multi_symbol_stock_analysis.main:test"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
