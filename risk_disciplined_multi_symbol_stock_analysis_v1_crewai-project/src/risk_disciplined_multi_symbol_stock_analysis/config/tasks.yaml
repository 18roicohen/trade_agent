---
data_collection_and_validation:
  description: |-
    Collect and validate market data for all symbols in {stock_symbols}. For each symbol:
    
    1. **Symbol Validation**: Verify symbol exists and has sufficient data
    2. **Data Collection**: Gather comprehensive market data including:
       - Current price, volume, market cap
       - Historical prices (minimum 1 year for analysis)
       - Basic fundamental metrics (P/E, EPS, Revenue)
       - 52-week high/low ranges
    3. **Data Quality Check**: Ensure data completeness and accuracy
    4. **Sector Classification**: Identify business sectors for diversification analysis
    5. **Batch Processing**: Organize data for efficient analysis workflow
    
    Focus on data reliability and completeness for downstream analysis.
  expected_output: |-
    DATA COLLECTION REPORT
    
    Validated Symbols: [X] out of [Total]
    
    | Symbol | Status | Company | Sector | Data Quality | Price | Volume |
    |--------|--------|---------|--------|--------------|-------|---------|
    | AAPL | ✅ Valid | Apple Inc | Technology | Excellent | $150.25 | 45.2M |
    | GOOGL | ✅ Valid | Alphabet | Technology | Excellent | $2,800.50 | 1.2M |
    
    Data Summary:
    - Historical Data Range: [Start Date] to [End Date]
    - Average Data Completeness: [X]%
    - Sector Diversification: [X] sectors represented
    - Ready for Analysis: [X] symbols
    
    Issues Found: [List any data problems]
    Recommended Processing Order: [Sequence for optimal analysis]
  agent: market_data_analyst

comprehensive_technical_analysis:
  description: |-
    Perform complete technical analysis for each symbol covering both short-term ({analysis_timeframe} days) and long-term timeframes:
    
    **Short-Term Analysis** (≤31 days):
    - Intraday momentum: RSI(14), Stochastic
    - Short MA signals: 5, 10, 20-day crossovers
    - Volume patterns and VWAP analysis
    - Immediate support/resistance levels
    
    **Long-Term Analysis** (>31 days):
    - Trend analysis: 50, 200-day moving averages
    - MACD signals and divergences
    - Long-term support/resistance zones
    - Price pattern recognition
    
    **Technical Scoring** (0-100):
    - Short-term signals: 40 points
    - Long-term trend: 35 points  
    - Volume confirmation: 25 points
    
    Provide unified technical recommendation with entry/exit levels.
  expected_output: |-
    COMPREHENSIVE TECHNICAL ANALYSIS
    
    **[SYMBOL]** - Technical Score: [X]/100
    Recommendation: BUY/SELL/HOLD | Confidence: [X]%
    Timeframe Bias: Short-term [Bullish/Bearish] | Long-term [Bullish/Bearish]
    
    **Short-Term Signals** ([X]/40 points):
    - RSI(14): [X] ([Oversold/Neutral/Overbought])
    - MA Alignment: [5/10/20-day status]
    - Volume: [Above/Below average - confirmation strength]
    
    **Long-Term Trend** ([X]/35 points):
    - 50/200 MA: [Golden Cross/Death Cross/Neutral]
    - MACD: [Signal and histogram status]
    - Primary Trend: [Uptrend/Downtrend/Sideways]
    
    **Key Levels**:
    - Entry: $[X.XX] | Stop-Loss: $[X.XX] | Target: $[X.XX]
    - Support: $[X.XX] | Resistance: $[X.XX]
    
    **Risk Warning**: [Primary technical risks]
    
    [Repeat for each symbol]
  agent: technical_analyst
  context: 
    - data_collection_and_validation

integrated_fundamental_and_risk_analysis:
  description: |-
    Perform comprehensive fundamental analysis integrated with risk assessment for each symbol:
    
    **Fundamental Analysis**:
    - Valuation: P/E ratio vs sector average, Price-to-Book
    - Growth: Revenue growth, EPS growth trends  
    - Financial Health: ROE, Debt-to-Equity, Current Ratio
    - Market Position: Market cap classification, competitive moat
    
    **Risk Assessment**:
    - Volatility Analysis: 30-day, 90-day price volatility
    - Beta Calculation: Market correlation and sensitivity
    - Liquidity Risk: Average volume, bid-ask spreads
    - Financial Stability: Debt levels, cash flow strength
    
    **Integrated Scoring**:
    - Fundamental Score: 0-100 (higher = better value/growth)
    - Risk Score: 0-100 (higher = more risky)
    - Risk-Adjusted Score: Fundamental score adjusted for risk level
    
    Focus on identifying value opportunities while quantifying associated risks.
  expected_output: |-
    FUNDAMENTAL & RISK ANALYSIS
    
    **[SYMBOL]** 
    Fundamental Score: [X]/100 | Risk Score: [Y]/100 | Risk Level: [LOW/MED/HIGH]
    Recommendation: BUY/SELL/HOLD | Risk-Adjusted Score: [Z]/100
    
    **Valuation Metrics**:
    - P/E Ratio: [X.X] vs Sector Avg: [Y.Y] ([Over/Under]valued)
    - Market Cap: $[X]B ([Large/Mid/Small] Cap)
    - Price-to-Book: [X.X] ([Premium/Discount] to book value)
    
    **Growth & Quality**:
    - Revenue Growth: [X]% (trailing 12M)
    - EPS Growth: [X]% (year-over-year)  
    - ROE: [X]% ([Strong/Weak] profitability)
    - Debt/Equity: [X.X] ([Conservative/Aggressive] leverage)
    
    **Risk Profile**:
    - 30-day Volatility: [X]% | 90-day Volatility: [Y]%
    - Beta: [X.X] ([More/Less] volatile than market)
    - Liquidity: [High/Medium/Low] (Volume: [X]M avg daily)
    - Financial Stability: [Strong/Moderate/Weak]
    
    **Investment Thesis**: [2-3 sentence summary]
    **Primary Risk**: [Main risk factor]
    **Position Sizing**: Max [X]% allocation (based on risk level)
    
    [Repeat for each symbol]
  agent: fundamental_analyst
  context:
    - data_collection_and_validation

portfolio_optimization_and_allocation:
  description: |-
    Create optimized portfolio allocation using strict risk-discipline framework:
    
    **MANDATORY THRESHOLDS**:
    - BUY: Combined Score ≥75 AND Risk ≤60
    - HOLD: Combined Score 60-74 OR (Score ≥75 AND Risk 61-70)  
    - SELL: Combined Score <60 OR Risk >70
    
    **ALLOCATION LIMITS**:
    - High Risk (71-100): 0% allocation (excluded)
    - Medium-High Risk (61-70): Max 5% allocation
    - Medium Risk (41-60): Max 10% allocation
    - Low Risk (0-40): Up to 20% allocation
    
    **Portfolio Construction**:
    1. Exclude all SELL recommendations and high-risk positions
    2. Calculate combined scores (Technical 40% + Fundamental 35% + Risk Adjustment 25%)
    3. Apply sector diversification (max 40% per sector)
    4. Optimize risk-adjusted returns within allocation limits
    5. Include backtesting validation for strategy confidence
    
    **Backtesting Requirement**: 
    Test the recommended allocations against 1-year historical data to validate strategy performance.
  expected_output: |-
    PORTFOLIO OPTIMIZATION REPORT
    
    **RECOMMENDED PORTFOLIO ALLOCATION** (Total: 100%)
    
    | Symbol | Combined Score | Risk Level | Allocation | Entry Price | Target | Stop Loss |
    |---------|---------------|------------|------------|-------------|---------|-----------|
    | [SYM1] | [X]/100 | LOW ([Y]) | [Z]% | $[A] | $[B] | $[C] |
    | [SYM2] | [X]/100 | MED ([Y]) | [Z]% | $[A] | $[B] | $[C] |
    
    **EXCLUDED POSITIONS**:
    | Symbol | Reason | Score | Risk |
    |---------|---------|--------|------|
    | [SYM] | High Risk | [X]/100 | [Y]/100 |
    | [SYM] | Low Score | [X]/100 | [Y]/100 |
    
    **PORTFOLIO METRICS**:
    - Portfolio Risk Level: [LOW/MEDIUM/HIGH]
    - Expected Annual Return: [X]% (based on analysis)
    - Maximum Drawdown Risk: [X]%
    - Sector Diversification: [X] sectors
    - Largest Position: [X]% ([Symbol])
    
    **BACKTESTING RESULTS** (1-Year Historical):
    - Strategy Return: [X]% vs S&P 500: [Y]%
    - Win Rate: [X]% of positions
    - Average Gain: [X]% | Average Loss: [Y]%
    - Maximum Drawdown: [X]%
    - Sharpe Ratio: [X.X]
    
    **IMPLEMENTATION PLAN**:
    1. **Immediate Action**: Buy [Symbol] ([X]% allocation)
    2. **Monitor Entry**: [Symbol] - waiting for entry at $[X]
    3. **Risk Management**: Set stop losses at specified levels
    4. **Review Schedule**: Weekly technical review, monthly fundamental review
    
    **EXECUTIVE SUMMARY**: 
    [3-sentence summary of top opportunity, risk management approach, and expected outcome]
  agent: portfolio_manager
  context:
    - comprehensive_technical_analysis  
    - integrated_fundamental_and_risk_analysis
